name: Deploy zu SiteGround

# Läuft auf einem GitHub-Runner – der hat Netzzugang zu SiteGround.
# Ausgelöst per Push auf den Branch oder von Hand über "Run workflow".
on:
  push:
    branches: [claude/lead-management-crm-5kniyn, main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Schema und Demo-Daten einspielen (nur beim ersten Mal)'
        type: boolean
        default: false

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Syntax aller Dateien prüfen
        run: |
          set -e
          find app bin db public_html -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "Syntax in Ordnung."

      - name: Zugangsdaten prüfen
        env:
          HOST: ${{ secrets.SG_HOST }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
          KEY: ${{ secrets.SG_SSH_KEY }}
        run: |
          missing=""
          [ -z "$HOST" ]   && missing="$missing SG_HOST"
          [ -z "$USER" ]   && missing="$missing SG_USER"
          [ -z "$TARGET" ] && missing="$missing SG_PATH"
          [ -z "$KEY" ]    && missing="$missing SG_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Es fehlen noch Secrets:$missing"
            echo ""
            echo "Anzulegen unter: Settings → Secrets and variables → Actions"
            echo ""
            echo "  SG_HOST     SSH-Host aus den Site Tools, z. B. ssh.meinkonto.sg-host.com"
            echo "  SG_PORT     SSH-Port, meist 18765 (ohne Angabe wird 18765 verwendet)"
            echo "  SG_USER     SSH-Benutzer, z. B. u1234-abcdefgh"
            echo "  SG_PATH     Zielverzeichnis, z. B. /home/customer/www/meine-domain.de"
            echo "  SG_SSH_KEY  der PRIVATE Schlüssel zu dem in SiteGround hinterlegten"
            echo "              öffentlichen Schlüssel (vollständiger Inhalt inkl. der"
            echo "              BEGIN- und END-Zeilen)"
            echo ""
            echo "Danach diesen Lauf über \"Re-run all jobs\" wiederholen."
            exit 1
          fi
          echo "Alle Zugangsdaten vorhanden."

      - name: SSH einrichten
        env:
          KEY: ${{ secrets.SG_SSH_KEY }}
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-18765}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Dateien übertragen
        env:
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
        run: |
          # --delete räumt Entferntes weg, aber niemals die Konfiguration
          # und niemals hochgeladene Dateien, Sitzungen oder Protokolle.
          rsync -az --delete \
            -e "ssh -p ${PORT:-18765} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'app/config.local.php' \
            --exclude 'storage/uploads/***' \
            --exclude 'storage/sessions/***' \
            --exclude 'storage/logs/***' \
            ./ "$USER@$HOST:$TARGET/"

      - name: Verzeichnisse und Rechte sicherstellen
        env:
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
        run: |
          ssh -p "${PORT:-18765}" -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "mkdir -p '$TARGET'/storage/{uploads,logs,sessions} && chmod -R 775 '$TARGET'/storage"

      - name: Schema und Demo-Daten einspielen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}
        env:
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
        run: |
          ssh -p "${PORT:-18765}" -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "cd '$TARGET' && php db/seed.php"

      - name: Selbsttest auf dem Server
        env:
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
        run: |
          ssh -p "${PORT:-18765}" -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "cd '$TARGET' && php bin/doctor.php"
