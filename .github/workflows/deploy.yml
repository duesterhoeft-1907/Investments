name: Deploy zu SiteGround

# Zwei Wege führen auf den Server, und beide sind in Ordnung:
#
#   a) der Server holt sich den Stand selbst (bin/pull-deploy.sh im Cron)
#   b) GitHub schiebt ihn per SSH hinüber – dafür braucht es Secrets
#
# Wer (a) nutzt, hat die Secrets nie angelegt. Dann soll dieser Workflow
# nicht bei jedem Push eine Fehlermail schicken: die Prüfung läuft, das
# Ausrollen wird übersprungen. Wer den Workflow von Hand startet, will
# ausrollen – dann ist ein fehlendes Secret sehr wohl ein Fehler.
on:
  push:
    branches: [claude/lead-management-crm-5kniyn, main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Schema und Demo-Daten einspielen (nur beim ersten Mal)'
        type: boolean
        default: false

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  # ── Prüfen ──────────────────────────────────────────────────────────
  # Läuft immer. Beim Cron-Weg zieht sich der Server den Stand blind –
  # eine kaputte Datei fiele dort erst auf, wenn die Seite weiß bleibt.
  # Deshalb ist dieser Schritt auch dann nützlich, wenn nichts ausgerollt
  # wird.
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      bereit: ${{ steps.zugang.outputs.bereit }}
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Syntax aller Dateien prüfen
        run: |
          set -e
          find app bin db public_html -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "Syntax in Ordnung."

      - name: Zugangsdaten prüfen
        id: zugang
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          VON_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # Bewusst mit if statt "[ -z ... ] && ...": GitHub führt jeden
          # run-Block mit "bash -e" aus, und eine solche Und-Verkettung
          # liefert 1, sobald die Bedingung nicht zutrifft – der Schritt
          # wäre also ausgerechnet dann abgebrochen, wenn alle Secrets da
          # sind.
          missing=""
          for name in SG_HOST SG_USER SG_PATH SG_SSH_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -z "$missing" ]; then
            echo "bereit=true" >> "$GITHUB_OUTPUT"
            echo "Alle Zugangsdaten vorhanden."
            exit 0
          fi

          echo "bereit=false" >> "$GITHUB_OUTPUT"

          echo "Es fehlen die Secrets:$missing"
          echo ""
          echo "Anzulegen unter: Settings → Secrets and variables → Actions"
          echo ""
          echo "  SG_HOST     SSH-Host aus den Site Tools, z. B. ssh.meinkonto.sg-host.com"
          echo "  SG_PORT     SSH-Port, meist 18765 (ohne Angabe wird 18765 verwendet)"
          echo "  SG_USER     SSH-Benutzer, z. B. u1234-abcdefgh"
          echo "  SG_PATH     Zielverzeichnis, z. B. /home/customer/www/meine-domain.de"
          echo "  SG_SSH_KEY  der PRIVATE Schlüssel zu dem in SiteGround hinterlegten"
          echo "              öffentlichen Schlüssel (inkl. BEGIN- und END-Zeile)"
          echo ""

          if [ "$VON_HAND" = "true" ]; then
            # Von Hand gestartet heißt: es soll ausgerollt werden. Ohne
            # Zugangsdaten geht das nicht, und das darf nicht durchrutschen.
            echo "::error::Ausrollen nicht möglich – es fehlen die Secrets:$missing"
            exit 1
          fi

          # Bei einem Push ist das kein Fehler, sondern der andere Weg:
          # der Server holt sich den Stand selbst per Cron
          # (bin/pull-deploy.sh). Dann ist hier nichts zu tun.
          echo "::notice::Ausrollen über GitHub übersprungen – es fehlen die Secrets:$missing. Holt der Server den Stand per Cron, ist das in Ordnung."

  # ── Ausrollen ───────────────────────────────────────────────────────
  # Nur wenn die Zugangsdaten da sind. Sonst überspringt GitHub den Job,
  # der Lauf bleibt grün, und es kommt keine Mail.
  deploy:
    needs: pruefen
    if: needs.pruefen.outputs.bereit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH einrichten
        env:
          KEY: ${{ secrets.SG_SSH_KEY }}
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-18765}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Dateien übertragen
        env:
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
        run: |
          # --delete räumt Entferntes weg, aber niemals die Konfiguration
          # und niemals hochgeladene Dateien, Sitzungen oder Protokolle.
          rsync -az --delete \
            -e "ssh -p ${PORT:-18765} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'app/config.local.php' \
            --exclude 'storage/uploads/***' \
            --exclude 'storage/sessions/***' \
            --exclude 'storage/logs/***' \
            ./ "$USER@$HOST:$TARGET/"

      - name: Verzeichnisse und Rechte sicherstellen
        env:
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
        run: |
          ssh -p "${PORT:-18765}" -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "mkdir -p '$TARGET'/storage/{uploads,logs,sessions} && chmod -R 775 '$TARGET'/storage"

      # Laeuft bei jedem Ausrollen: die Schritte pruefen selbst, ob sie noetig
      # sind, und aendern nichts an bestehenden Daten.
      - name: Datenbank nachziehen
        env:
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
        run: |
          ssh -p "${PORT:-18765}" -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "cd '$TARGET' && php db/migrate.php"

      - name: Schema und Demo-Daten einspielen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}
        env:
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
        run: |
          ssh -p "${PORT:-18765}" -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "cd '$TARGET' && php db/seed.php"

      - name: Selbsttest auf dem Server
        env:
          HOST: ${{ secrets.SG_HOST }}
          PORT: ${{ secrets.SG_PORT }}
          USER: ${{ secrets.SG_USER }}
          TARGET: ${{ secrets.SG_PATH }}
        run: |
          ssh -p "${PORT:-18765}" -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "cd '$TARGET' && php bin/doctor.php"
